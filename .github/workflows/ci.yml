name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Canned chat answers (no API key in CI): the build shows the launcher and
    # the E2E suite exercises the chat. Ignored by production builds.
    env:
      CHAT_MOCK: "1"
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

      # Smoke + axe against the production build above (`pnpm start`).
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # M7: schema, RLS and the seed against a local Supabase stack (Docker).
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The seed is generated from lib/content/data: it must be up to date.
      - run: pnpm db:seed:generate && git diff --exit-code supabase/seed.sql

      - run: pnpm db:start
      - run: pnpm test:db

      # Generated types must match the migrations.
      - run: pnpm db:types && git diff --exit-code types/database.ts
